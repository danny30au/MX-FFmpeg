name: Build MX Player Custom FFmpeg Codec

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      codec_version:
        description: 'Target MX Player Codec Version (e.g., 1.49.0 or 3.1.0)'
        required: true
        default: '1.49.0'
      arch_abi:
        description: 'Target MX Architecture Suffix'
        required: true
        default: 'neon64'
        type: choice
        options:
          - neon64
          - neon
          - x86_64
          - x86

env:
  CODEC_VERSION: ${{ github.event.inputs.codec_version || '1.49.0' }}
  MX_ARCH: ${{ github.event.inputs.arch_abi || 'neon64' }}
  NDK_VERSION: '27.2.12479018'

jobs:
  build-ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup & Verify Android NDK r27
        run: |
          NDK_PATH=""
          if [ -d "${ANDROID_HOME}/ndk/${NDK_VERSION}" ]; then
            NDK_PATH="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          else
            EXISTING_NDK27=$(find "${ANDROID_HOME}/ndk" -maxdepth 1 -type d -name "27.*" 2>/dev/null | sort -V | tail -n 1 || true)
            if [ -n "${EXISTING_NDK27}" ] && [ -x "${EXISTING_NDK27}/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" ]; then
              NDK_PATH="${EXISTING_NDK27}"
            fi
          fi

          if [ -z "${NDK_PATH}" ]; then
            echo "Installing NDK ${NDK_VERSION} via sdkmanager..."
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
            NDK_PATH="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          fi

          LLVM_BIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          if [ ! -x "${LLVM_BIN}/clang" ]; then
            echo "::error::Clang compiler not found at ${LLVM_BIN}/clang"
            exit 1
          fi

          echo "Using NDK at: ${NDK_PATH}"
          "${LLVM_BIN}/clang" --version

          echo "${NDK_PATH}" >> $GITHUB_PATH
          echo "${LLVM_BIN}" >> $GITHUB_PATH
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> $GITHUB_ENV
          echo "NDK_ROOT=${NDK_PATH}" >> $GITHUB_ENV
          echo "NDK=${NDK_PATH}" >> $GITHUB_ENV
          echo "LLVM_BIN=${LLVM_BIN}" >> $GITHUB_ENV

          # Map MX shipping name -> Android ABI (required by ./build.sh)
          case "${MX_ARCH}" in
            neon64)
              echo "ANDROID_ABI=arm64-v8a" >> $GITHUB_ENV
              echo "TARGET_MARCH=armv8.2-a+dotprod+fp16+crypto+i8mm" >> $GITHUB_ENV
              echo "OPT_CFLAGS=-O3 -march=armv8.2-a+dotprod+fp16+crypto+i8mm -ffunction-sections -fdata-sections -fPIC -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types -Wno-error=format-security" >> $GITHUB_ENV
              ;;
            neon)
              echo "ANDROID_ABI=armeabi-v7a" >> $GITHUB_ENV
              echo "TARGET_MARCH=armv7-a" >> $GITHUB_ENV
              echo "OPT_CFLAGS=-O3 -ffunction-sections -fdata-sections -fPIC -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types -Wno-error=format-security" >> $GITHUB_ENV
              ;;
            *)
              echo "ANDROID_ABI=${MX_ARCH}" >> $GITHUB_ENV
              echo "TARGET_MARCH=x86-64" >> $GITHUB_ENV
              echo "OPT_CFLAGS=-O3 -ffunction-sections -fdata-sections -fPIC -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types -Wno-error=format-security" >> $GITHUB_ENV
              ;;
          esac

          echo "OPT_LDFLAGS=-fuse-ld=lld -Wl,--gc-sections -Wl,--icf=safe -Wl,--exclude-libs,ALL -Wl,-z,max-page-size=16384" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            yasm nasm pkg-config zip unzip p7zip-full binutils dos2unix \
            make perl autoconf automake libtool autopoint gettext \
            meson ninja-build ragel cmake python3-pip

      - name: Patch Config Scripts & Run Full Build Pipeline
        run: |
          # 1. Strip CRLF line endings and mark scripts executable
          find . -type f \( -name "*.sh" -o -name "ENV" -o -name "configure" -o -name "*.mk" \) -exec sed -i 's/\r$//' {} +
          find . -type f \( -name "*.sh" -o -name "configure" \) -exec chmod +x {} +

          # Helper function to patch NDK paths, Clang 18 flags, and -march overrides across both root and src/jni
          apply_patches() {
            find . -type f \( -name "*.sh" -o -name "ENV" \) -exec sed -i \
              -e "s|^export NDK=.*|export NDK=${ANDROID_NDK_HOME}|g" \
              -e "s|^NDK=.*|NDK=${ANDROID_NDK_HOME}|g" \
              -e "s|CPU_CORE=[0-9]*|CPU_CORE=$(nproc)|g" \
              -e 's/arm64-v8a)/arm64|neon64|arm64-v8a|aarch64)/g' \
              -e 's/aarch64)/arm64|neon64|arm64-v8a|aarch64)/g' {} +

            # Replace hardcoded -march=armv8-a in config-ffmpeg.sh so it does not override TARGET_MARCH
            if [ "${MX_ARCH}" = "neon64" ]; then
              find . -name "config-ffmpeg.sh" -exec sed -i "s/-march=armv8-a/-march=${TARGET_MARCH}/g" {} +
            fi

            # Add Clang 18 compatibility flags and LLVM binutils to ENV files
            for env_file in $(find . -name "ENV"); do
              if ! grep -q "Wno-error=implicit-function-declaration" "${env_file}"; then
                echo 'export CFLAGS="${CFLAGS} -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types -Wno-error=format-security"' >> "${env_file}"
                echo "export AR=\"${LLVM_BIN}/llvm-ar\"" >> "${env_file}"
                echo "export RANLIB=\"${LLVM_BIN}/llvm-ranlib\"" >> "${env_file}"
                echo "export NM=\"${LLVM_BIN}/llvm-nm\"" >> "${env_file}"
                echo "export STRIP=\"${LLVM_BIN}/llvm-strip\"" >> "${env_file}"
              fi
            done

            # Ensure ndk-build (Application.mk) allows legacy C/C++ code in mxutil, lame, iconv, etc. under Clang 18
            for app_mk in $(find . -name "Application.mk"); do
              if ! grep -q "Wno-error=implicit-function-declaration" "${app_mk}"; then
                echo "" >> "${app_mk}"
                echo "APP_CFLAGS += -Wno-error=implicit-function-declaration -Wno-error=int-conversion -Wno-error=incompatible-function-pointer-types -Wno-error=format-security" >> "${app_mk}"
                echo "APP_CPPFLAGS += -Wno-register -Wno-error=format-security" >> "${app_mk}"
              fi
            done
          }

          # 2. Apply patches before ./build.sh copies config files into src/jni
          apply_patches

          export EXTRA_CFLAGS="${OPT_CFLAGS}"
          export EXTRA_LDFLAGS="${OPT_LDFLAGS}"

          # 3. Run ./build.sh with ANDROID_ABI (arm64-v8a) so all prerequisites (openssl, smb2, lame, mxutil) are built
          echo "=== Running ./build.sh ${ANDROID_ABI} ==="
          if ! ./build.sh "${ANDROID_ABI}"; then
            echo "=== ./build.sh ${ANDROID_ABI} interrupted; checking missing prerequisite libraries in src/jni ==="
            apply_patches
            cd src/jni
            mkdir -p "libs/${ANDROID_ABI}"

            # Build OpenSSL if missing
            if [ ! -f "libs/${ANDROID_ABI}/libcrypto.a" ] && [ -f "./build-openssl.sh" ]; then
              ./build-openssl.sh "${ANDROID_ABI}" || ./build-openssl.sh arm64
            fi

            # Build libsmb2 if missing
            if [ ! -f "libs/${ANDROID_ABI}/libsmb2.a" ] && [ -f "./build-libsmb2.sh" ]; then
              ./build-libsmb2.sh "${ANDROID_ABI}" || ./build-libsmb2.sh arm64
            fi

            # Build libmp3lame if a dedicated script exists
            if [ ! -f "libs/${ANDROID_ABI}/libmp3lame.a" ] && [ -f "./build-lame.sh" ]; then
              ./build-lame.sh "${ANDROID_ABI}" || ./build-lame.sh arm64
            fi

            # Build dav1d if a dedicated script exists
            if [ -f "./build-dav1d.sh" ]; then
              ./build-dav1d.sh "${ANDROID_ABI}" || ./build-dav1d.sh arm64 || true
            fi

            # Run ndk-build to compile libmxutil, libmp3lame, and other Android.mk static/shared modules
            if [ ! -f "libs/${ANDROID_ABI}/libmxutil.so" ] && [ ! -f "libs/${ANDROID_ABI}/libmxutil.a" ]; then
              "${ANDROID_NDK_HOME}/ndk-build" -j"$(nproc)" APP_ABI="${ANDROID_ABI}" NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk || true
            fi

            # Copy any static/shared libraries from obj/local/<ABI> into libs/<ABI> so -L../libs/arm64-v8a finds them
            if [ -d "obj/local/${ANDROID_ABI}" ]; then
              find "obj/local/${ANDROID_ABI}" -maxdepth 1 \( -name "*.a" -o -name "*.so" \) -exec cp -n {} "libs/${ANDROID_ABI}/" \;
            fi

            echo "=== Contents of src/jni/libs/${ANDROID_ABI} before running build-ffmpeg.sh ==="
            ls -la "libs/${ANDROID_ABI}/"

            if ! ./build-ffmpeg.sh "${ANDROID_ABI}"; then
              echo "::error::build-ffmpeg.sh failed! Dumping ffbuild/config.log:"
              find . -name "config.log" -exec tail -n 60 {} +
              exit 1
            fi
          fi

      - name: Strip Unneeded Symbols & Verify ELF Headers
        run: |
          SO_PATH=$(find . -path "*${ANDROID_ABI}*" -name "libffmpeg.mx.so*" | head -n 1)
          if [ -z "${SO_PATH}" ]; then
            SO_PATH=$(find . -type f \( -name "libffmpeg.mx.so" -o -name "libffmpeg.mx.so.${MX_ARCH}*" \) | head -n 1)
          fi

          if [ -z "${SO_PATH}" ]; then
            echo "::error::libffmpeg.mx.so was not found after build!"
            find . -maxdepth 5 -name "*.so*"
            exit 1
          fi

          echo "Found binary at: ${SO_PATH}"
          echo "Size before strip: $(stat -c%s "${SO_PATH}") bytes"
          "${LLVM_BIN}/llvm-strip" --strip-unneeded "${SO_PATH}"
          echo "Size after strip:  $(stat -c%s "${SO_PATH}") bytes"

          # 1. Verify DT_SONAME matches libffmpeg.mx.so
          if ! "${LLVM_BIN}/llvm-readelf" -d "${SO_PATH}" | grep -q "Library soname: \[libffmpeg.mx.so\]"; then
            echo "::error::Invalid or missing DT_SONAME! MX Player will reject this library."
            exit 1
          fi

          # 2. Verify PT_LOAD alignment
          "${LLVM_BIN}/llvm-readelf" -l "${SO_PATH}" | grep "LOAD"

          # 3. Verify core FFmpeg entry points are exported in .dynsym
          for sym in avcodec_version avformat_version avutil_version swresample_version; do
            if ! "${LLVM_BIN}/llvm-nm" -D "${SO_PATH}" | grep -q " T ${sym}"; then
              echo "::error::Missing required exported symbol: ${sym}"
              exit 1
            fi
          done

          echo "STAGE_SO_PATH=${SO_PATH}" >> $GITHUB_ENV

      - name: Package Flat Deflate Zip for MX Player
        run: |
          mkdir -p dist
          TARGET_BIN="dist/libffmpeg.mx.so.${MX_ARCH}.${CODEC_VERSION}"
          TARGET_ZIP="dist/mx_aio_${MX_ARCH}_${CODEC_VERSION}.zip"

          cp "${STAGE_SO_PATH}" "${TARGET_BIN}"

          # -j junk paths (flat root structure required by MX Player)
          # -9 maximum standard Deflate compression
          zip -j -9 "${TARGET_ZIP}" "${TARGET_BIN}"

          unzip -l "${TARGET_ZIP}"
          sha256sum "${TARGET_ZIP}" "${TARGET_BIN}" > dist/checksums.sha256

      - name: Upload Codec Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mx-codec-${{ env.MX_ARCH }}-${{ env.CODEC_VERSION }}
          path: |
            dist/*.zip
            dist/libffmpeg.mx.so.*
            dist/checksums.sha256
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/checksums.sha256
          generate_release_notes: true
