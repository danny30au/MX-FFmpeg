name: Build MX Player Custom FFmpeg Codec

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      codec_version:
        description: 'Target MX Player Codec Version (e.g., 1.49.0 or 3.1.0)'
        required: true
        default: '1.49.0'
      arch_abi:
        description: 'Target MX Architecture Suffix'
        required: true
        default: 'neon64'
        type: choice
        options:
          - neon64
          - neon
          - x86_64
          - x86

env:
  CODEC_VERSION: ${{ github.event.inputs.codec_version || '1.49.0' }}
  MX_ARCH: ${{ github.event.inputs.arch_abi || 'neon64' }}
  NDK_VERSION: 'r27c'

jobs:
  build-ffmpeg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK r27c
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: false
          local-cache: true

      - name: Configure NDK Toolchain Path & Optimization Flags
        run: |
          NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          LLVM_BIN="${NDK_PATH}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "${LLVM_BIN}" >> $GITHUB_PATH

          # Export common NDK environment variables used across FFmpeg build scripts
          echo "ANDROID_NDK_HOME=${NDK_PATH}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${NDK_PATH}" >> $GITHUB_ENV
          echo "NDK_ROOT=${NDK_PATH}" >> $GITHUB_ENV
          echo "NDK=${NDK_PATH}" >> $GITHUB_ENV

          # Optimal ARM64 flags for neon64 builds
          if [ "${MX_ARCH}" = "neon64" ]; then
            echo "OPT_CFLAGS=-O3 -flto=thin -march=armv8.2-a+dotprod+fp16+crypto -ffunction-sections -fdata-sections -fPIC" >> $GITHUB_ENV
          else
            echo "OPT_CFLAGS=-O3 -flto=thin -ffunction-sections -fdata-sections -fPIC" >> $GITHUB_ENV
          fi

          # LLD + 16KB ELF alignment + RELR relocation packing + hide static library internals
          echo "OPT_LDFLAGS=-flto=thin -fuse-ld=lld -Wl,--gc-sections -Wl,--icf=safe -Wl,--exclude-libs,ALL -Wl,-z,max-page-size=16384 -Wl,--pack-dyn-relocs=android+relr -Wl,-soname,libffmpeg.mx.so" >> $GITHUB_ENV

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm pkg-config zip binutils dos2unix

      - name: Compile libffmpeg.mx.so
        run: |
          # 1. Strip any Windows CRLF (\r\n) line endings and mark scripts executable
          find . -type f \( -name "*.sh" -o -name "ENV" -o -name "configure" \) -exec sed -i 's/\r$//' {} +
          find . -type f \( -name "*.sh" -o -name "configure" \) -exec chmod +x {} +

          # 2. Locate build-ffmpeg.sh (or fallback build.sh) across root, ffmpeg/JNI, or jni
          BUILD_SCRIPT=$(find . -maxdepth 3 -name "build-ffmpeg.sh" | head -n 1)
          if [ -z "${BUILD_SCRIPT}" ]; then
            BUILD_SCRIPT=$(find . -maxdepth 3 -name "build.sh" | head -n 1)
          fi

          if [ -z "${BUILD_SCRIPT}" ]; then
            echo "::error::Could not find build-ffmpeg.sh or build.sh in repository!"
            find . -maxdepth 3 -name "*.sh"
            exit 1
          fi

          BUILD_DIR=$(dirname "${BUILD_SCRIPT}")
          SCRIPT_NAME=$(basename "${BUILD_SCRIPT}")
          echo "Found build script: ${BUILD_SCRIPT} (working directory: ${BUILD_DIR})"
          cd "${BUILD_DIR}"

          # 3. If an ENV file exists in the build directory, point its NDK path to our NDK
          if [ -f "ENV" ]; then
            sed -i "s|^export NDK=.*|export NDK=${ANDROID_NDK_HOME}|g" ENV
            sed -i "s|^NDK=.*|NDK=${ANDROID_NDK_HOME}|g" ENV
          fi

          # 4. Map neon64 -> arm64 if the script expects 'arm64' as the target argument
          TARGET_ARG="${MX_ARCH}"
          if [ "${MX_ARCH}" = "neon64" ] && ! grep -q "neon64" "${SCRIPT_NAME}"; then
            if grep -q "arm64" "${SCRIPT_NAME}"; then
              TARGET_ARG="arm64"
              echo "Mapped MX_ARCH=neon64 to script argument: ${TARGET_ARG}"
            fi
          fi

          export EXTRA_CFLAGS="${OPT_CFLAGS}"
          export EXTRA_LDFLAGS="${OPT_LDFLAGS}"

          # Run OpenSSL/dependency helper first if present and required by your repo
          if [ -f "./build-openssl.sh" ]; then
            ./build-openssl.sh "${TARGET_ARG}" || true
          fi

          bash "./${SCRIPT_NAME}" "${TARGET_ARG}"

      - name: Strip Unneeded Symbols & Verify ELF Headers
        run: |
          SO_PATH=$(find . -name "libffmpeg.mx.so" | head -n 1)
          if [ -z "${SO_PATH}" ]; then
            echo "::error::libffmpeg.mx.so was not found after build!"
            exit 1
          fi

          echo "Found binary at: ${SO_PATH}"
          echo "Size before strip: $(stat -c%s "${SO_PATH}") bytes"
          llvm-strip --strip-unneeded "${SO_PATH}"
          echo "Size after strip:  $(stat -c%s "${SO_PATH}") bytes"

          # 1. Verify DT_SONAME matches libffmpeg.mx.so
          if ! llvm-readelf -d "${SO_PATH}" | grep -q "Library soname: \[libffmpeg.mx.so\]"; then
            echo "::error::Invalid or missing DT_SONAME! MX Player will reject this library."
            exit 1
          fi

          # 2. Verify 16 KB (0x4000) PT_LOAD alignment
          llvm-readelf -l "${SO_PATH}" | grep "LOAD"
          if ! llvm-readelf -l "${SO_PATH}" | grep "LOAD" | grep -q "0x0000000000004000"; then
            echo "::warning::PT_LOAD segments are not 16 KB (0x4000) aligned."
          fi

          # 3. Verify core FFmpeg entry points are exported in .dynsym
          for sym in avcodec_version avformat_version avutil_version swresample_version; do
            if ! llvm-nm -D "${SO_PATH}" | grep -q " T ${sym}"; then
              echo "::error::Missing required exported symbol: ${sym}"
              exit 1
            fi
          done

          echo "STAGE_SO_PATH=${SO_PATH}" >> $GITHUB_ENV

      - name: Package Flat Deflate Zip for MX Player
        run: |
          mkdir -p dist
          TARGET_BIN="dist/libffmpeg.mx.so.${MX_ARCH}.${CODEC_VERSION}"
          TARGET_ZIP="dist/mx_aio_${MX_ARCH}_${CODEC_VERSION}.zip"

          cp "${STAGE_SO_PATH}" "${TARGET_BIN}"

          # -j junk paths (flat root structure required by MX Player)
          # -9 maximum standard Deflate compression
          zip -j -9 "${TARGET_ZIP}" "${TARGET_BIN}"

          # Verify zip structure contains no nested folders
          unzip -l "${TARGET_ZIP}"
          sha256sum "${TARGET_ZIP}" "${TARGET_BIN}" > dist/checksums.sha256

      - name: Upload Codec Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mx-codec-${{ env.MX_ARCH }}-${{ env.CODEC_VERSION }}
          path: |
            dist/*.zip
            dist/libffmpeg.mx.so.*
            dist/checksums.sha256
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/checksums.sha256
          generate_release_notes: true
