name: build custom codecs

on:
  workflow_dispatch:
    inputs:
      store_artifact:
        description: "Store Artifacts"
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: checkout tools repo
        uses: actions/checkout@v4
      - name: install build tools
        run: sudo apt update && sudo apt install -y nasm meson ninja-build
      - name: setting up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
      - name: hook build.sh to upgrade armv8-a to armv9-a once unpacked
        run: |
          sed -i 's|build-ffmpeg.sh arm64|build-ffmpeg.sh arm64|; /build-ffmpeg.sh/i find . -name "build-ffmpeg.sh" -exec sed -i "s/-march=armv8-a/-march=armv9-a+crypto+dotprod+i8mm+sve2 -mcpu=cortex-x4/g" {} +' build.sh
      - name: build arm64 codec
        run: ./build.sh --arm64
        shell: bash
        env:
          LDFLAGS: "-Wl,--emit-relocs -Wl,--gc-sections -Wl,-Bsymbolic -Wl,--undefined-version"
          CFLAGS: "-O3 -march=armv9-a+crypto+dotprod+i8mm+sve2 -mcpu=cortex-x4 -fomit-frame-pointer -fno-signed-zeros -fno-trapping-math -funroll-loops"
          CXXFLAGS: "-O3 -march=armv9-a+crypto+dotprod+i8mm+sve2 -mcpu=cortex-x4 -fomit-frame-pointer -fno-signed-zeros -fno-trapping-math -funroll-loops"
          EXTRA_CFLAGS: "-flto=full -falign-loops=32 -falign-functions=64 -mllvm -unroll-threshold=400"
          EXTRA_CXXFLAGS: "-flto=full -falign-loops=32 -falign-functions=64 -mllvm -unroll-threshold=400"
      - name: dump ffmpeg config.log on failure
        if: failure()
        run: find . -name "config.log" -exec tail -n 50 {} +
      - name: save artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifact-arm64
          path: |
            output/*.zip
            !output/aio*.zip
          if-no-files-found: error

  build-neon:
    runs-on: ubuntu-latest
    steps:
      - name: checkout tools repo
        uses: actions/checkout@v4
      - name: install build tools
        run: sudo apt update && sudo apt install -y nasm meson ninja-build
      - name: setting up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30
      - name: build neon codec
        run: ./build.sh --neon
        shell: bash
        env:
          LDFLAGS: "-Wl,--emit-relocs -Wl,--gc-sections -Wl,-Bsymbolic -Wl,--undefined-version"
          CFLAGS: "-O3 -fomit-frame-pointer -fno-signed-zeros -fno-trapping-math -funroll-loops"
          CXXFLAGS: "-O3 -fomit-frame-pointer -fno-signed-zeros -fno-trapping-math -funroll-loops"
          EXTRA_CFLAGS: "-flto=full -falign-loops=32 -falign-functions=64 -mllvm -unroll-threshold=400"
          EXTRA_CXXFLAGS: "-flto=full -falign-loops=32 -falign-functions=64 -mllvm -unroll-threshold=400"
      - name: dump ffmpeg config.log on failure
        if: failure()
        run: find . -name "config.log" -exec tail -n 50 {} +
      - name: save artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifact-neon
          path: |
            output/*.zip
            !output/aio*.zip
          if-no-files-found: error

  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: checkout tools repo
        uses: actions/checkout@v4
      - name: install build tools
        run: sudo apt update && sudo apt install -y nasm meson ninja-build
      - name: setting up NDK
        uses
