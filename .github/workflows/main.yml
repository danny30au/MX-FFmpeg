name: build custom codecs

on:
  workflow_dispatch:
    inputs:
      store_artifact:
        description: "Store Artifacts"
        type: boolean
        default: false
  push:
    tags:
      - "v*.*.*"

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: checkout tools repo
        uses: actions/checkout@v4

      - name: install build tools
        run: sudo apt update && sudo apt install -y nasm meson ninja-build zip unzip binutils

      - name: setting up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30

      - name: wrap NDK linker in-place to preserve RPATH and emit relocations for BOLT
        shell: bash
        run: |
          BOLT_BIN=$(find /opt/hostedtoolcache/ndk -name "llvm-bolt" | head -n 1)
          TOOLCHAIN_BIN=$(dirname "$BOLT_BIN")
          echo "Found NDK toolchain bin: $TOOLCHAIN_BIN"

          # Replace llvm-strip symlink with a no-op during build so relocations survive for BOLT
          rm -f "$TOOLCHAIN_BIN/llvm-strip"
          printf '#!/usr/bin/env bash\nexit 0\n' > "$TOOLCHAIN_BIN/llvm-strip"
          chmod +x "$TOOLCHAIN_BIN/llvm-strip"

          # Replace ld.lld symlink in-place and invoke $DIR/lld with argv[0]="ld.lld"
          rm -f "$TOOLCHAIN_BIN/ld.lld"
          cat << 'EOF' > "$TOOLCHAIN_BIN/ld.lld"
          #!/usr/bin/env bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/../lib:$DIR/../lib64:${LD_LIBRARY_PATH:-}"
          ARGS=()
          for arg in "$@"; do
            case "$arg" in
              -s|--strip-all|--strip-debug) continue ;;
              *) ARGS+=("$arg") ;;
            esac
          done
          if [[ " ${ARGS[*]} " == *" -shared "* ]]; then
            exec -a ld.lld "$DIR/lld" "${ARGS[@]}" --emit-relocs --gc-sections --icf=all -Bsymbolic -z now --undefined-version
          else
            exec -a ld.lld "$DIR/lld" "${ARGS[@]}"
          fi
          EOF
          chmod +x "$TOOLCHAIN_BIN/ld.lld"

      - name: build arm64 codec
        run: ./build.sh --arm64
        shell: bash
        env:
          LDFLAGS: "-Wl,--emit-relocs -Wl,--gc-sections -Wl,--icf=all -Wl,-Bsymbolic -Wl,-z,now -Wl,--undefined-version"
          CFLAGS: "-O3 -march=armv9-a+crypto+dotprod+i8mm+sve2 -mcpu=cortex-x4 -fomit-frame-pointer -fno-signed-zeros -fno-trapping-math -funroll-loops"
          CXXFLAGS: "-O3 -march=armv9-a+crypto+dotprod+i8mm+sve2 -mcpu=cortex-x4 -fomit-frame-pointer -fno-signed-zeros -fno-trapping-math -funroll-loops"
          EXTRA_CFLAGS: "-flto=full -fwhole-program-vtables -fno-semantic-interposition -fno-plt -ffp-contract=fast -fno-math-errno -falign-loops=32 -falign-functions=64 -mllvm -unroll-threshold=400 -march=armv9-a+crypto+dotprod+i8mm+sve2 -mcpu=cortex-x4"
          EXTRA_CXXFLAGS: "-flto=full -fwhole-program-vtables -fno-semantic-interposition -fno-plt -ffp-contract=fast -fno-math-errno -falign-loops=32 -falign-functions=64 -mllvm -unroll-threshold=400 -march=armv9-a+crypto+dotprod+i8mm+sve2 -mcpu=cortex-x4"

      - name: optimize arm64 binary with llvm-bolt
        if: success()
        shell: bash
        run: |
          BOLT_BIN=$(find /opt/hostedtoolcache/ndk -name "llvm-bolt" | head -n 1)
          TOOLCHAIN_BIN=$(dirname "$BOLT_BIN")
          export LD_LIBRARY_PATH="$TOOLCHAIN_BIN/../lib:$TOOLCHAIN_BIN/../lib64:${LD_LIBRARY_PATH:-}"
          echo "Using llvm-bolt: $BOLT_BIN"

          for zip_file in output/*.zip; do
            [[ "$zip_file" == *"aio"* ]] && continue
            mkdir -p bolt_work
            unzip -q "$zip_file" -d bolt_work/
            for so_file in bolt_work/*; do
              if file "$so_file" | grep -q "ELF"; then
                echo "Verifying relocations in $so_file..."
                readelf -S "$so_file" | grep -E "rela\.text|rel\.text" || true
                echo "Running BOLT on $so_file..."
                "$BOLT_BIN" "$so_file" -o "${so_file}.bolt" \
                  --lite=0 \
                  --icf=all \
                  --peepholes=all \
                  --plt=all \
                  --align-functions=64 \
                  --use-gnu-stack
                mv "${so_file}.bolt" "$so_file"
              fi
            done
            rm -f "$zip_file"
            (cd bolt_work && zip -q -9 "../$zip_file" *)
            rm -rf bolt_work
          done

      - name: dump ffmpeg config.log on failure
        if: failure()
        run: find . -name "config.log" -exec tail -n 50 {} +

      - name: save artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifact-arm64
          path: |
            output/*.zip
            !output/aio*.zip
          if-no-files-found: error

  build-neon:
    runs-on: ubuntu-latest
    steps:
      - name: checkout tools repo
        uses: actions/checkout@v4

      - name: install build tools
        run: sudo apt update && sudo apt install -y nasm meson ninja-build

      - name: setting up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30

      - name: build neon codec
        run: ./build.sh --neon
        shell: bash
        env:
          LDFLAGS: "-Wl,--emit-relocs -Wl,--gc-sections -Wl,--icf=all -Wl,-Bsymbolic -Wl,-z,now -Wl,--undefined-version"
          CFLAGS: "-O3 -fomit-frame-pointer -fno-signed-zeros -fno-trapping-math -funroll-loops"
          CXXFLAGS: "-O3 -fomit-frame-pointer -fno-signed-zeros -fno-trapping-math -funroll-loops"
          EXTRA_CFLAGS: "-flto=full -fwhole-program-vtables -fno-semantic-interposition -fno-plt -ffp-contract=fast -fno-math-errno -falign-loops=32 -falign-functions=64 -mllvm -unroll-threshold=400"
          EXTRA_CXXFLAGS: "-flto=full -fwhole-program-vtables -fno-semantic-interposition -fno-plt -ffp-contract=fast -fno-math-errno -falign-loops=32 -falign-functions=64 -mllvm -unroll-threshold=400"

      - name: dump ffmpeg config.log on failure
        if: failure()
        run: find . -name "config.log" -exec tail -n 50 {} +

      - name: save artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifact-neon
          path: |
            output/*.zip
            !output/aio*.zip
          if-no-files-found: error

  build-x86_64:
    runs-on: ubuntu-latest
    steps:
      - name: checkout tools repo
        uses: actions/checkout@v4

      - name: install build tools
        run: sudo apt update && sudo apt install -y nasm meson ninja-build

      - name: setting up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30

      - name: build x86_64 codec
        run: ./build.sh --x86_64
        shell: bash
        env:
          LDFLAGS: "-Wl,--emit-relocs -Wl,--gc-sections -Wl,--icf=all -Wl,-Bsymbolic -Wl,-z,now -Wl,--pack-dyn-relocs=relr -Wl,--undefined-version"
          CFLAGS: "-O3 -fomit-frame-pointer -fno-signed-zeros -fno-trapping-math -funroll-loops"
          CXXFLAGS: "-O3 -fomit-frame-pointer -fno-signed-zeros -fno-trapping-math -funroll-loops"
          EXTRA_CFLAGS: "-flto=full -fwhole-program-vtables -fno-semantic-interposition -fno-plt -ffp-contract=fast -fno-math-errno"
          EXTRA_CXXFLAGS: "-flto=full -fwhole-program-vtables -fno-semantic-interposition -fno-plt -ffp-contract=fast -fno-math-errno"

      - name: save artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifact-x86_64
          path: |
            output/*.zip
            !output/aio*.zip
          if-no-files-found: error

  build-x86:
    runs-on: ubuntu-latest
    steps:
      - name: checkout tools repo
        uses: actions/checkout@v4

      - name: install build tools
        run: sudo apt update && sudo apt install -y nasm meson ninja-build

      - name: setting up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r30

      - name: build x86 codec
        run: ./build.sh --x86
        shell: bash
        env:
          LDFLAGS: "-Wl,--emit-relocs -Wl,--gc-sections -Wl,--icf=all -Wl,-Bsymbolic -Wl,-z,now -Wl,--undefined-version"
          CFLAGS: "-O3 -fomit-frame-pointer -fno-signed-zeros -fno-trapping-math -funroll-loops"
          CXXFLAGS: "-O3 -fomit-frame-pointer -fno-signed-zeros -fno-trapping-math -funroll-loops"
          EXTRA_CFLAGS: "-flto=full -fwhole-program-vtables -fno-semantic-interposition -fno-plt -ffp-contract=fast -fno-math-errno"
          EXTRA_CXXFLAGS: "-flto=full -fwhole-program-vtables -fno-semantic-interposition -fno-plt -ffp-contract=fast -fno-math-errno"

      - name: save artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifact-x86
          path: |
            output/*.zip
            !output/aio*.zip
          if-no-files-found: error

  publishing:
    runs-on: ubuntu-latest
    needs: [build-arm64, build-neon, build-x86_64, build-x86]
    steps:
      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: artifact-*
          merge-multiple: true

      - name: list all artifacts
        run: ls -R artifacts

      - name: merge artifacts
        if: success()
        run: |
          mkdir temp
          unzip -q 'artifacts/*.zip' -d temp/
          zip -j artifacts/aio-${{ github.ref_name }}.zip temp/*

      - name: publish artifacts
        uses: softprops/action-gh-release@v1
        if: ${{ github.ref_type == 'tag' }}
        with:
          files: artifacts/*.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
